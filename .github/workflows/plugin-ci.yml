name: Plugin tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: plugin/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Go race tests
        working-directory: plugin
        run: go test -race ./... -count=1
      - name: Go vet
        working-directory: plugin
        run: go vet ./...
      - name: UI tests
        working-directory: plugin
        run: node --test ui-tests/*.test.cjs
      - name: Build Linux amd64 runtime
        working-directory: plugin
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -buildvcs=false -ldflags='-s -w' -o ../build/state-kit-linux-amd64 ./cmd/state-kit
